version: "3.9"

services:
  postgres:
    extends:
      file: docker-compose.yml
      service: postgres
    container_name: smartassist-db
    restart: unless-stopped
    volumes:
      - /mnt/syncstore/smartassist/data/postgres17:/var/lib/postgresql/data

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: smartassist-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: smartassist-ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    depends_on:
      - api

  ollama:
    image: ollama/ollama:latest
    container_name: smartassist-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - /mnt/syncstore/smartassist/data/ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
