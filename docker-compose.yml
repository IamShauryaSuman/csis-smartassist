# Standalone SQL development database. Use the Supabase CLI for the full API stack.
services:
  postgres:
    image: public.ecr.aws/supabase/postgres:17.6.1.143
    ports:
      - "127.0.0.1:${SMARTASSIST_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      POSTGRES_HOST: /var/run/postgresql
    volumes:
      - supabase_pg17:/var/lib/postgresql/data
      - ./supabase/migrations:/app-migrations:ro
      - ./scripts/init-local-db.sh:/docker-entrypoint-initdb.d/zz-smartassist.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD psql -h localhost -U postgres -d postgres -Atc \"select to_regprocedure('public.claim_booking_decision(uuid,uuid,boolean)') is not null\" | grep -qx t"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  supabase_pg17:
